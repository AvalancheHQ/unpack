name: CodSpeed Performance Benchmarks
'on':
  push:
    branches:
    - main
    - master
  pull_request: null
permissions:
  contents: read
  id-token: write
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly-2025-06-04
    - name: Install cargo-codspeed
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-codspeed
    - name: Build benchmarks
      run: cargo codspeed build -p unpack_core
    - name: Run benchmarks
      uses: CodSpeedHQ/action@v4
      with:
        upload-url: ${{ secrets.CODSPEED_FRANCOIS_DEV_UPLOAD_URL }}
        mode: simulation
        run: cargo codspeed run -p unpack_core
